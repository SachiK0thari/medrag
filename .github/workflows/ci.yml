name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --frozen installs exactly what uv.lock pins and fails if the lock is
      # out of date with pyproject.toml, so the committed lock is what CI tests.
      - name: Install
        run: |
          uv sync --frozen --extra dev --python ${{ matrix.python-version }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy src

      - name: Pytest
        env:
          OPENROUTER_API_KEY: dummy
          PINECONE_API_KEY: dummy
        run: pytest -m "not integration"
