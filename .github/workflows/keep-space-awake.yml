name: keep-space-awake

# A free Hugging Face Space sleeps after about 48 hours without visitors, and
# the first visitor then waits through a cold boot. Load the demo page about
# every 40 hours, inside that window but no more often than needed. This only
# opens the page: it asks no question, so it spends no LLM tokens, reranker
# quota or rate-limit slot.
#
# Cron has no 40-hour interval, so the schedule fires every 8 hours (00:00,
# 08:00, 16:00 UTC) and the `due` job lets one firing in five through, which
# makes the visits exactly 40 hours apart. A manual run always visits. The
# `due` job takes a few seconds; the visits it skips show as skipped in the
# Actions tab.

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  due:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      visit: ${{ steps.check.outputs.visit }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # Count 8-hour slots since the epoch rather than hours, so a run that
          # GitHub starts late (it often does) still lands in its own slot.
          slot=$(( $(date -u +%s) / 28800 ))
          if [ "$EVENT" != schedule ] || [ $((slot % 5)) -eq 0 ]; then
            echo "visit=true" >> "$GITHUB_OUTPUT"
          else
            echo "visit=false" >> "$GITHUB_OUTPUT"
            echo "not due: next visit in $(( (5 - slot % 5) * 8 )) h"
          fi

  visit:
    needs: due
    if: needs.due.outputs.visit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Visit the Space and wait until it is running
        env:
          API: https://huggingface.co/api/spaces/SachiK/medrag
          APP: https://sachik-medrag.hf.space/
        run: |
          stage() { curl -fsS "$API" | jq -r '.runtime.stage'; }
          echo "stage before: $(stage)"
          curl -fsS -o /dev/null -L "$APP" || true
          for i in $(seq 1 40); do
            s=$(stage)
            if [ "$s" = RUNNING ]; then echo "running after ~$((i * 10)) s"; exit 0; fi
            echo "$s"; sleep 10
          done
          echo "::error::Space is still $s after about 7 minutes"
          exit 1
