[project]
name = "medrag"
version = "0.1.0"
description = "Agentic RAG over GLP-1 cardiovascular outcome literature from PubMed/PMC."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]

dependencies = [
    # Core
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    "tenacity>=8.3,<9",
    "tqdm>=4.66,<5",

    # Ingestion
    "lxml>=5.2,<6",
    "beautifulsoup4>=4.12,<5",

    # Embeddings + reranker (local, free)
    "sentence-transformers>=3.0,<4",
    "torch>=2.3,<3",

    # Retrieval
    "pinecone>=5.0,<6",
    "rank-bm25>=0.2.2,<0.3",

    # LLM + agent
    "groq>=0.11,<1",
    "langgraph>=0.2,<0.3",

    # Storage
    "sqlmodel>=0.0.21,<0.1",

    # API + UI
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.31",
    "streamlit>=1.38,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5.0,<6",
    "ruff>=0.6,<0.7",
    "mypy>=1.11,<2",
    "pre-commit>=3.8,<4",
    "types-requests",
]
eval = [
    "ragas>=0.2,<0.3",
    "datasets>=2.21,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medrag"]

# ---------- Ruff ----------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "N",             # pep8-naming
    "ANN",           # annotations
]
ignore = ["ANN101", "ANN102", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S101"]
"scripts/*" = ["ANN"]

# ---------- Mypy ----------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "rank_bm25.*",
    "sentence_transformers.*",
    "pinecone.*",
    "groq.*",
    "langgraph.*",
    "ragas.*",
]
ignore_missing_imports = true

# ---------- Pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --cov=medrag --cov-report=term-missing"
markers = [
    "integration: requires network or external services",
    "slow: takes more than a few seconds",
]
